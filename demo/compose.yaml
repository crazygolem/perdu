      perdu-demo.icon: "di:authentik"
      perdu-demo.category: "~admin"
      perdu-demo.audience: "admins"
      perdu-demo.actions.password.name.en: "Change password"
      perdu-demo.actions.password.name.fr: "Changer de mot de passe"
      perdu-demo.actions.password.url: "https://auth.home.example/if/user/#/settings"
      perdu-demo.actions.password.icon: "fa:solid-key"
      perdu-demo.actions.password.category: "Tools"
      perdu-demo.actions.password.audience: "users"
      perdu-demo.actions.logout.name.en: "Log out"
      perdu-demo.actions.logout.name.fr: "Se déconnecter"
