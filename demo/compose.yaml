    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "BookStack"
      perdu-demo.description.en: "The family's recipes and how-tos"
      perdu-demo.description.fr: "Les recettes et les modes d'emploi de la famille"
      perdu-demo.url: "https://wiki.home.example/"
      perdu-demo.icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/bookstack-dark.svg"
      perdu-demo.category: "Documents"
      perdu-demo.audience: "users"

  home-assistant:
    <<: *service
    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "Home Assistant"
      perdu-demo.description.en: "Lights, heating and the garden's watering"
      perdu-demo.description.fr: "Lumières, chauffage et arrosage du jardin"
      perdu-demo.url: "https://ha.home.example/"
      perdu-demo.icon: "di:home-assistant"
      perdu-demo.category: "Home"
      perdu-demo.audience: "users"

  # Shown to everyone, guests included.
  jellyfin:
    <<: *service
    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "Jellyfin"
      perdu-demo.description.en: "Films and series"
      perdu-demo.description.fr: "Films et séries"
      perdu-demo.description.de: "Filme und Serien"
      perdu-demo.url: "https://jellyfin.home.example/"
      perdu-demo.icon: "di:jellyfin"
      perdu-demo.category: "Media"

  # An icon given by its URL, which the viewer's browser fetches itself.
  navidrome:
    <<: *service
    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "Navidrome"
      perdu-demo.description.en: "The family's music"
      perdu-demo.description.fr: "La musique de la famille"
      perdu-demo.url: "https://music.home.example/"
      perdu-demo.icon: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/navidrome.svg"
      perdu-demo.category: "Media"

  immich:
    <<: *service
    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "Immich"
      perdu-demo.description.en: "Photos and videos, backed up from everyone's phone"
      perdu-demo.description.fr: "Photos et vidéos, sauvegardées depuis le téléphone de chacun"
      perdu-demo.url: "https://photos.home.example/"
      perdu-demo.icon: "di:immich"
      perdu-demo.category: "Media"
      perdu-demo.audience: "users"

  # In English alone: the French and German pages fall back to it. Among
  # the tools, but for administrators alone: a section places a tile, and
  # its audience alone says who sees it.
  forgejo:
    <<: *service
    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "Forgejo"
      perdu-demo.description.en: "The home server's code and configuration"
      perdu-demo.url: "https://git.home.example/"
      perdu-demo.icon: "di:forgejo"
      perdu-demo.category: "Tools"
      perdu-demo.audience: "admins"

  vaultwarden:
    <<: *service
    labels:
      perdu-demo.enable: "true"
      perdu-demo.name: "Vaultwarden"
      perdu-demo.description.en: "Passwords, shared within the family"
      perdu-demo.description.fr: "Les mots de passe, partagés en famille"
      perdu-demo.url: "https://vault.home.example/"
      perdu-demo.icon: "di:vaultwarden"
      perdu-demo.category: "Tools"
      perdu-demo.audience: "users"

  # The login service, for administrators, with two actions in Tools, a
  # section it isn't in, so that each is a tile of its own there, shown to
  # those its own audience names. Log out links to the front end's /logout.
  authentik:
    <<: *service
    labels:
      perdu-demo.enable: "true"
